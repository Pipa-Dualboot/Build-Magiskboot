name: Build magiskboot
on:
  schedule:
    - cron: 0 0 1 * *
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup building environment
        run: |
          mkdir -p $GITHUB_WORKSPACE/build_workdir
          echo "BUILD_TIME=$(TZ=Asia/Shanghai date "+%Y%m%d-%H%M")-UTC+8" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build
        run: |
          cd $GITHUB_WORKSPACE/build_workdir
          rm -rf out
          mkdir -p out/x86_64 out/arm64-v8a
          git clone --recurse-submodules https://github.com/topjohnwu/Magisk.git magiskboot
          cd magiskboot
          chmod +x ./build.py
          ./build.py ndk
          echo "abiList=arm64-v8a,x86_64" > config.prop
          ./build.py -v -r native magiskboot
          cp -p ./native/out/x86_64/magiskboot $GITHUB_WORKSPACE/build_workdir/out/x86_64/
          cp -p ./native/out/arm64-v8a/magiskboot $GITHUB_WORKSPACE/build_workdir/out/arm64-v8a/
          file $GITHUB_WORKSPACE/build_workdir/out/*/magiskboot

      - name: Commit files
        run: |
          cd $GITHUB_WORKSPACE/build_workdir
          cp -r ./out $GITHUB_WORKSPACE
          cd $GITHUB_WORKSPACE
          rm -rf build_workdir
          rm -rf ./x86_64 ./arm64-v8a ./x86 ./armeabi-v7a
          mv -f ./out/* .
          rm -rf ./out
          {
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add .
            git commit -m "$(date "+%Y-%m-%d %H:%M:%S") UTC" -a
            if [ $? -eq 0 ]; then
                date >> RunDate.txt
                git commit -m "$(date "+%Y-%m-%d %H:%M:%S")" -a
                git push
            else
                echo No Update
            fi
          } || {
            echo Execution Failed >RunDate.txt
            exit 1
          }
